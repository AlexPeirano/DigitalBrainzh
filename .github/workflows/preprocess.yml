name: EEG Preprocessing Pipeline (DataLad)

# Déclenchement : uniquement quand un fichier dans data/raw/ est modifié
on:
  push:
    branches: [main]
    paths:
      - 'data/raw/**'

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
      # 1. Installer git-annex + DataLad + MNE sur la VM
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git-annex

      - name: Install Python dependencies
        run: pip install datalad mne numpy

      # 2. Cloner le dataset DataLad (juste les pointeurs, sans les gros fichiers)
      - name: Clone DataLad dataset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name  "CI Bot DBZH"
          git config --global user.email "ci@dbzh-pilot.fr"
          datalad clone \
            https://x-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} \
            "${RUNNER_TEMP}/dbzh"

      # 3. Télécharger uniquement les fichiers EEG bruts (depuis l'annex remote)
      - name: Get raw EEG files
        working-directory: ${{ runner.temp }}/dbzh
        run: |
          # Get all EEG files recursively from data/raw
          datalad get -r data/raw/ || true
          echo "Fichiers bruts disponibles :"
          find data/raw -type f \( -name "*.edf" -o -name "*.fif" -o -name "*.set" \) | sort

      # 4. Lancer le prétraitement (auto-détection des nouveaux fichiers)
      - name: Preprocess new EEG files
        working-directory: ${{ runner.temp }}/dbzh
        run: |
          datalad run \
            --message "ci: preprocess new EEG files" \
            "python code/preprocess.py"

      # 5. Pousser les résultats vers GitHub et OSF
      #    (les gros .fif vont dans l'annex/OSF, les JSON de rapport dans Git)
      - name: Push processed results
        working-directory: ${{ runner.temp }}/dbzh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Vérifier s'il y a des changements à pusher
          if git diff --quiet && git diff --staged --quiet; then
            echo "Rien de nouveau à pusher."
          else
            # Push commits and metadata to GitHub
            datalad push --to origin
            echo "✓ Commits pushed to GitHub"

            # Push file content to OSF
            datalad push --to osf-storage data/processed/ || echo "⚠ No new files to push to OSF"
            echo "✓ File content pushed to OSF"
          fi
